name: Vinted Favorites Tracker

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python vinted_favorites_tracker.py
